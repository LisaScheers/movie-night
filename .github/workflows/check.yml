name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --accept-flake-config
      - run: nix develop --impure --accept-flake-config --command npm ci
      - run: nix develop --impure --accept-flake-config --command npm run test:stream
